---
# yamllint disable rule:line-length
# Required variables use ${VAR:?} so Compose fails immediately when one is
# missing from the environment file. .env is the single source of truth for the
# image reference, host publishing, and instance identity.
# scripts/check.sh validates the file; scripts/new.sh derives
# per-instance copies from it.
name: "${COMPOSE_PROJECT_NAME:-indigo}"

x-restart-policy: &restart-policy unless-stopped

services:
  indigo:
    image: "${REGISTRY:?}/${REGISTRY_PROJECT:?}/${IMAGE:?}:${VERSION:?}"
    build:
      context: .
      args:
        NOTEBOOK_VERSION: "${NOTEBOOK_VERSION:?}"
    hostname: "${INDIGO_HOSTNAME:?}"
    restart: *restart-policy
    stdin_open: true
    tty: true
    gpus: all
    shm_size: "${INDIGO_SHM_SIZE:?}"
    stop_grace_period: "${INDIGO_STOP_GRACE_PERIOD:?}"
    environment:
      HEALTHCHECK_HOST: 127.0.0.1
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "${LLAMA_ARG_PORT:-10732}"
      LLAMA_ARG_CTX_SIZE: "${LLAMA_ARG_CTX_SIZE:-0}"
      LLAMA_ARG_N_PARALLEL: "${LLAMA_ARG_N_PARALLEL:-2}"
      MODEL_DIRECTORY: /home/nonroot/.models
      INDIGO_DEFAULT_MODEL: "${INDIGO_DEFAULT_MODEL:-gpt-oss-20b}"
      INDIGO_SEED_AGENT_CONFIG: "${INDIGO_SEED_AGENT_CONFIG:-true}"
      MCP_FILESYSTEM_URL: http://127.0.0.1:11002/mcp
      MCP_FILESYSTEM_PORT: "11002"
      MCP_FILESYSTEM_WORKSPACE: /home/nonroot/dev
      MCP_RUST_ANALYZER_URL: http://127.0.0.1:11003/mcp
      MCP_RUST_ANALYZER_PORT: "11003"
      RUST_ANALYZER_WORKSPACE: "${RUST_ANALYZER_WORKSPACE:-/home/nonroot/dev}"
      OPENVIKING_URL: http://127.0.0.1:1933
      OPENVIKING_CONFIG_FILE: /home/nonroot/.openviking/ov.conf
      OPENVIKING_SERVER_HOST: 127.0.0.1
      OPENVIKING_SERVER_PORT: "1933"
      OPENVIKING_WITH_BOT: "${OPENVIKING_WITH_BOT:-0}"
      OPENVIKING_CONF_CONTENT: "${OPENVIKING_CONF_CONTENT:-}"
      PINOKIO_HOME: /home/nonroot/.pinokio
      PINOKIO_DOMAIN: "${PINOKIO_DOMAIN:?}"
      PINOKIO_HTTPS_ACTIVE: "1"
      PINOKIO_NETWORK_ACTIVE: "1"
    ports:
      - "${INDIGO_PUBLISH_HOST:?}:${INFERENCE_PUBLISHED_PORT:?}:10732"
      - "${INDIGO_PUBLISH_HOST:?}:${CODE_SERVER_PUBLISHED_PORT:?}:1337"
      - "${INDIGO_PUBLISH_HOST:?}:${VERDACCIO_PUBLISHED_PORT:?}:4873"
      - "${INDIGO_PUBLISH_HOST:?}:${JUPYTER_PUBLISHED_PORT:?}:13337"
      - "${INDIGO_PUBLISH_HOST:?}:${MARIMO_PUBLISHED_PORT:?}:13338"
      - "${INDIGO_PUBLISH_HOST:?}:${OPENVIKING_PUBLISHED_PORT:?}:1933"
      - "${INDIGO_PUBLISH_HOST:?}:${PINOKIO_PUBLISHED_PORT:?}:42000"
      - "${INDIGO_PUBLISH_HOST:?}:${PINOKIO_PROXY_PUBLISHED_PORT:?}:8080"
      - "${INDIGO_PUBLISH_HOST:?}:${MCP_FILESYSTEM_PUBLISHED_PORT:?}:11002"
      - "${INDIGO_PUBLISH_HOST:?}:${MCP_RUST_ANALYZER_PUBLISHED_PORT:?}:11003"
    volumes:
      - workspace:/home/nonroot/dev
      - models:/home/nonroot/.models
      - opencode-config:/home/nonroot/.config/opencode
      - opencode-data:/home/nonroot/.local/share/opencode
      - codex:/home/nonroot/.codex
      - openviking:/home/nonroot/.openviking
      - pinokio:/home/nonroot/.pinokio
      - cargo-cache:/home/nonroot/.cargo
    networks: [indigo]

networks:
  indigo:

volumes:
  workspace:
  models:
  opencode-config:
  opencode-data:
  codex:
  openviking:
  pinokio:
  cargo-cache:
