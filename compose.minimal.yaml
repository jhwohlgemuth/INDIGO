---
# Opt-in lower-idle-cost service set. Inference and the Notebook base services
# remain available; optional auxiliary services stay disabled.
services:
  indigo:
    environment:
      LLAMA_ARG_CTX_SIZE: "${LLAMA_ARG_CTX_SIZE:-8192}"
      LLAMA_ARG_BATCH: "${LLAMA_ARG_BATCH:-512}"
      LLAMA_ARG_UBATCH: "${LLAMA_ARG_UBATCH:-256}"
      LLAMA_ARG_N_PARALLEL: "${LLAMA_ARG_N_PARALLEL:-1}"
      INDIGO_ENABLE_INFERENCE: "1"
      INDIGO_ENABLE_FILESYSTEM: "0"
      INDIGO_ENABLE_RUST_ANALYZER: "0"
      INDIGO_ENABLE_OPENVIKING: "0"
      INDIGO_ENABLE_PINOKIO: "0"
