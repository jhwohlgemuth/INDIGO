---
name: Container

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Load image configuration
        run: |
          while IFS='=' read -r name value; do
            case "${name}" in
              REGISTRY|REGISTRY_PROJECT|IMAGE|VERSION|NOTEBOOK_VERSION|NOTEBOOK_DIGEST)
                printf '%s=%s\n' "${name}" "${value}" >> "${GITHUB_ENV}"
                ;;
            esac
          done < .env
          image_ref="$(awk -F= '
            $1 == "REGISTRY" { registry = $2 }
            $1 == "REGISTRY_PROJECT" { project = $2 }
            $1 == "IMAGE" { image = $2 }
            $1 == "VERSION" { version = $2 }
            END { print registry "/" project "/" image ":" version }
          ' .env)"
          printf 'INDIGO_IMAGE_REF=%s\n' "${image_ref}" >> "${GITHUB_ENV}"
          printf 'INDIGO_IMAGE_LATEST=%s\n' "${image_ref%:*}:latest" >> "${GITHUB_ENV}"
      - name: Install shell validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck yamllint
      - name: Install shfmt
        run: |
          curl --fail --location --output /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.11.0/shfmt_v3.11.0_linux_amd64
          printf '%s  %s\n' \
            1904ec6bac715c1d05cd7f6612eec8f67a625c3749cb327e5bfb4127d09035ff \
            /tmp/shfmt | sha256sum --check
          sudo install /tmp/shfmt /usr/local/bin/shfmt
      - name: Install Hadolint command
        run: |
          cat > /tmp/hadolint <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          digest='sha256:aacf4eda44e40057051f5c5b02546e3a'
          digest+='da7e8b84d4bbf9312c89524a7e9a0b51'
          exec docker run --rm --volume "${PWD}:/work" --workdir /work \
            "ghcr.io/hadolint/hadolint:v2.15.1-debian@${digest}" \
            hadolint "$@"
          EOF
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
      - name: Check shell scripts
        run: make check
      - name: Lint build and Compose configuration
        run: make lint
      - name: Free space for the image build
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /usr/local/share/powershell /usr/local/.ghcup /opt/hostedtoolcache
          df -h /
      - name: Add swap for Docker layer export
        run: |
          if ! detail="$(sudo fallocate -l 16G /indigo.swap 2>&1)"; then
            echo "::error title=Swap allocation failed::${detail}"
            exit 1
          fi
          sudo chmod 600 /indigo.swap
          if ! detail="$(sudo mkswap /indigo.swap 2>&1)"; then
            echo "::error title=Swap formatting failed::${detail}"
            exit 1
          fi
          if ! detail="$(sudo swapon /indigo.swap 2>&1)"; then
            echo "::error title=Enable swap failed::${detail}"
            exit 1
          fi
          free -h
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build CPU validation image
        timeout-minutes: 60
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: |
            ${{ env.INDIGO_IMAGE_REF }}
            ${{ env.INDIGO_IMAGE_LATEST }}
          build-args: |
            NOTEBOOK_VERSION=${{ env.NOTEBOOK_VERSION }}
            NOTEBOOK_DIGEST=${{ env.NOTEBOOK_DIGEST }}
            INDIGO_LLAMA_BACKEND=cpu
            INDIGO_LLAMA_BUILD_JOBS=1
          cache-from: type=gha,scope=container-cpu
          cache-to: type=gha,mode=max,scope=container-cpu,ignore-error=true
      - name: Smoke test image contents
        run: make image-smoke
      - name: Boot and stop disposable container
        run: make runtime-smoke

  windows-config:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Compose modes
        shell: pwsh
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.cpu.yaml config --quiet
          docker compose -f compose.yaml -f compose.isolated.yaml config --quiet
          docker compose -f compose.yaml -f compose.cpu.yaml `
            -f compose.isolated.yaml config --quiet
          docker compose -f compose.yaml -f compose.minimal.yaml config --quiet
          docker compose -f compose.yaml -f compose.cpu.yaml `
            -f compose.isolated.yaml -f compose.minimal.yaml config --quiet
          $cpu = docker compose -f compose.yaml -f compose.cpu.yaml config
          if ($cpu -match '(?m)^    gpus:') {
            throw 'CPU mode still contains a GPU reservation'
          }
          $isolated = docker compose -f compose.yaml `
            -f compose.isolated.yaml config
          if ($isolated -match '(?m)^      - type: bind$') {
            throw 'Isolated mode still contains a host bind mount'
          }
      - name: Verify checkout line endings
        run: git diff --exit-code
